tracker</button></div>`}<div class="row"><h3 class="sectionTitle">Today's Activity</h3><span class="tiny muted">${today.length} entries</span></div><div class="card">${today.length?today.slice(0,state.showAll?undefined:3).map(entry).join(''):'<div class="empty-state"><span class="empty-symbol" aria-hidden="true">✓</span><strong>Ready when you are.</strong><span>Your logged activity will appear here.</span></div>'}${today.length>3&&!activityEdit?`<button class="outline" data-showall style="width:100%;margin-top:10px">${state.showAll?'Show less':'Show all '+today.length+' entries'}</button>`:''}${deletedUndo?`<button class="outline" data-restore-entry style="width:100%;margin-top:10px">↶ Undo deleted entry</button>`:''}${today.length?`<div class="today-totals"><b class="tiny">TODAY'S TOTALS</b>${[...new Set(today.map(r=>r.slotId))].map(id=>{const rs=today.filter(r=>r.slotId===id);return `<div class="entry"><span class="tiny">${esc(rs[0].name)}</span><b>${fmt(sum(rs))} ${esc(rs[0].unit)}</b></div>`}).join('')}</div>`:''}<button class="outline secondary-action" data-log-earlier>＋ Log Earlier</button><button class="edit-blue activity-toggle" data-edit-activity>↶ ${activityEdit?'Done Editing':'Edit Activity'}</button></div>`}
function trends(){const list=records(),now=new Date(),n=Number(state.period)||30,from=new Date(now);from.setHours(0,0,0,0);from.setDate(from.getDate()-n+1);const filtered=list.filter(r=>new Date(r.time)>=from),ids=[...new Set([...state.slots.map(s=>s.id),...filtered.map(r=>r.slotId)])];const totals=ids.map(id=>{const slot=state.slots.find(s=>s.id===id),rs=filtered.filter(r=>r.slotId===id),unit=slot?.unit||rs[0]?.unit||'';return{id,name:slot?.name||rs[0]?.name||id,unit,color:slot?.color||'#62788b',total:sum(rs),count:rs.length}}).filter(x=>x.count||state.slots.some(s=>s.id===x.id));const [year,month]=calendarMonth.split('-').map(Number),first=new Date(year,month-1,1),offset=first.getDay(),length=new Date(year,month,0).getDate();const cells=Array.from({length:offset},()=>'<span></span>').concat(Array.from({length},(_,i)=>{const d=calendarMonth+'-'+String(i+1).padStart(2,'0'),count=list.filter(r=>day(r.time)===d).length;return `<button class="calendar-day ${state.selectedDate===d?'chosen':''}" data-calendar-day="${d}" aria-label="${d}, ${count} entries">${i+1}${count?'<i></i>':''}</button>`}));const selected=list.filter(r=>day(r.time)===state.selectedDate);const dailyTotals=[...new Set(selected.map(r=>r.slotId+'|'+r.unit))].map(key=>{const rs=selected.filter(r=>r.slotId+'|'+r.unit===key),firstRecord=rs[0],slot=state.slots.find(s=>s.id===firstRecord.slotId);return {name:slot?.name||firstRecord.name||'Tracker',unit:firstRecord.unit||slot?.unit||'',color:slot?.color||firstRecord.color||'#62788b',total:sum(rs),count:rs.length}});return `<div class="review-heading"><h2 class="h">Your Trends</h2><button class="review-pdf" type="button" data-review-pdf aria-label="View or share ${n} day PDF report">▤ ${n}-Day PDF</button></div><div class="review-period-label">REVIEW ACTIVITY BY DATE RANGE</div><div class="review-periods" role="group" aria-label="Choose days to review">${[7,14,30,90].map(v=>`<button type="button" class="${n===v?'selected':''}" data-period="${v}" aria-pressed="${n===v}"><strong>${v}</strong><span>days</span></button>`).join('')}</div><div class="card"><h3>Totals by tracker</h3>${totals.length?totals.map(x=>`<div class="entry"><b style="color:${esc(x.color)}">${esc(x.name)}</b><span><b>${fmt(x.total)} ${esc(x.unit)}</b><small class="muted"> · ${x.count} logs</small></span></div>`).join(''):'<div class="empty-state"><strong>Ready when you are.</strong><span>Totals appear after your first log.</span></div>'}</div><div class="card calendar-focus"><div class="calendar-watermark-area"><p class="calendar-hint">Tap any day for a quick reference.</p><div class="row"><button class="outline" data-month="-1" aria-label="Previous month">‹</button><h3>${esc(first.toLocaleDateString([],{month:'long',year:'numeric'}))}</h3><button class="outline" data-month="1" aria-label="Next month">›</button></div><div class="calendar-grid">${['S','M','T','W','T','F','S'].map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div></div><h4>${esc(new Date(state.selectedDate+'T12:00:00').toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'}))} · ${selected.length} entries</h4>${selected.length?`<div class="daily-summary"><div class="daily-summary-title">DAILY TOTALS BY TRACKER</div>${dailyTotals.map(x=>`<div class="daily-total-row" style="border-left-color:${esc(x.color)}"><span class="daily-total-name" style="color:${esc(x.color)}">${esc(x.name)}</span><span class="daily-total-value">${fmt(x.total)} ${esc(x.unit)} <small>(${x.count} ${x.count===1?'log':'logs'})</small></span></div>`).join('')}</div><h4 class="daily-activity-title">Individual entries</h4>${selected.map(entry).join('')}`:'<p class="note">No entries for this day.</p>'}</div><div class="card"><h3>Monthly Activity Snapshot</h3><p class="note">${list.filter(r=>new Date(r.time).getMonth()===now.getMonth()&&new Date(r.time).getFullYear()===now.getFullYear()).length} entries this calendar month. ${list.filter(r=>{const d=new Date(r.time);return d.getFullYear()===(now.getMonth()===0?now.getFullYear()-1:now.getFullYear())&&d.getMonth()===(now.getMonth()+11)%12}).length} entries last month. Export a report from Share for more detail.</p><button class="outline" data-go-share>Open Share</button></div>`}

// Self-contained PDF export: all content is generated on this device, without network requests.
function reviewPdfBytes(daysOverride=null, idsOverride=null){
 const allRecords=records(),requested=daysOverride==='all'?Math.max(1,Math.ceil((Date.now()-Math.min(Date.now(),...allRecords.map(r=>Date.parse(r.time))))/86400000)+1):Number(daysOverride||state.period)||30;
 const n=requested,now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-n+1);
 const list=allRecords.filter(r=>new Date(r.time)>=start&&new Date(r.time)<=now&&(!idsOverride||!idsOverride.length||idsOverride.includes(r.slotId))).sort((a,b)=>Date.parse(b.time)-Date.parse(a.time));
 const dateLabel=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
 const ascii=x=>String(x??'').normalize('NFKD').replace(/[^\x20-\x7e]/g,'?');
 const pdfText=x=>ascii(x).replace(/[\\()]/g,'\\$&');
 const pages=[];let cmds=[],y=0;
 const rgb=h=>{const a=/^#[0-9a-f]{6}$/i.test(h)?h:'#1769c2';return [1,3,5].map(i=>(parseInt(a.slice(i,i+2),16)/255).toFixed(3)).join(' ')};
 const fill=(x,Y,w,h,color)=>cmds.push(`${rgb(color)} rg ${x.toFixed(1)} ${Y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);
 const line=(x1,Y1,x2,Y2,color='#dce9f4')=>cmds.push(`${rgb(color)} RG 0.7 w ${x1} ${Y1} m ${x2} ${Y2} l S`);
 const text=(x,Y,value,size=11,bold=false,color='#12365a')=>cmds.push(`${rgb(color)} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(1)} ${Y.toFixed(1)} Tm (${pdfText(value)}) Tj ET`);
 function begin(){cmds=[];fill(0,0,612,792,'#ffffff');fill(0,760,612,32,'#1769c2');text(40,773,'InsuTap',16,true,'#ffffff');text(486,774,'ACTIVITY REPORT',8,true,'#ffffff');text(40,735,'Every unit. One tap.',12,true,'#1769c2');text(40,710,`${n}-day report  |  ${dateLabel(start)} - ${dateLabel(now)}`,12,true);line(40,696,572,696);y=676;}
 function finish(){pages.push(cmds.join('\n'));}
 function ensure(height){if(y-height<55){finish();begin();}}
 begin();text(40,y,`Recorded entries: ${list.length}  |  Generated: ${dateLabel(now)}`,10);y-=27;
 const group=new Map();for(const r of list){const k=r.slotId+'|'+r.unit;const v=group.get(k)||{name:r.name,unit:r.unit,amount:0,count:0};v.amount+=Number(r.amount);v.count++;group.set(k,v);}
 text(40,y,'TOTALS BY TRACKER',11,true,'#1769c2');y-=20;
 if(!group.size){text(44,y,'No recorded entries in this period.',10);y-=22;}
 for(const v of group.values()){ensure(19);text(44,y,`${v.name}  -  ${fmt(v.amount)} ${v.unit}  (${v.count} logs)`,10);y-=19;}
 y-=12;ensure(75);text(40,y,'RECORDED ACTIVITY',11,true,'#1769c2');y-=22;
 fill(40,y-7,532,22,'#eaf4ff');text(48,y,'TRACKER',9,true);text(242,y,'UNITS',9,true);text(355,y,'DATE / TIME',9,true);y-=30;
 for(const r of list){ensure(26);const when=new Date(r.time).toLocaleString('en-US',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});const trackerColor=state.slots.find(t=>t.id===r.slotId)?.color||'#62788b';fill(46,y-3,4,13,trackerColor);text(57,y,ascii(r.name).slice(0,27),9,true,trackerColor);text(242,y,`${fmt(r.amount)} ${r.unit}`.slice(0,16),9,true);text(355,y,when,9);line(40,y-7,572,y-7,'#e5edf4');y-=25;}
 // Chart: daily entry counts by tracker, preserving the user's tracker colors.
 ensure(220);y-=10;text(40,y,'USAGE TREND  |  DAILY LOGS BY TRACKER',11,true,'#1769c2');y-=20;
 const bins=Array.from({length:n},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return day(d)});
 const trackerIds=[...new Set(list.map(r=>r.slotId))];
 const dayCounts=new Map();for(const r of list){const k=day(new Date(r.time))+'|'+r.slotId;dayCounts.set(k,(dayCounts.get(k)||0)+1);}
 const max=Math.max(1,...bins.map(d=>trackerIds.reduce((sum,id)=>sum+(dayCounts.get(d+'|'+id)||0),0)));
 const base=y-118,chartHeight=105,chartWidth=522,barWidth=chartWidth/n;
 line(44,base,566,base,'#aec6d8');
 bins.forEach((d,i)=>{let stack=0;for(const id of trackerIds){const count=dayCounts.get(d+'|'+id)||0;if(!count)continue;const h=count/max*chartHeight;const color=state.slots.find(t=>t.id===id)?.color||'#62788b';fill(45+i*barWidth,base+stack,Math.max(1,barWidth-1),h,color);stack+=h;}});
 text(44,base-16,dateLabel(start),9);text(468,base-16,dateLabel(now),9);y=base-34;
 for(const id of trackerIds.slice(0,6)){ensure(15);const r=list.find(x=>x.slotId===id),color=state.slots.find(t=>t.id===id)?.color||'#62788b';fill(44,y-2,9,9,color);text(58,y,ascii(r.name).slice(0,34),8);y-=13;}
 ensure(45);text(40,y,'Colored bars represent daily entry counts by tracker, not combined medication units.',9,false,'#58728b');y-=16;
 text(40,y,'User-entered records may be incomplete. Not medical advice.',9,false,'#58728b');
 finish();
 // PDF 1.4: one stream per page, built entirely in memory.
 const objects=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
 const pageIds=[];for(const content of pages){const pageId=objects.length,streamId=pageId+1;pageIds.push(pageId);objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${streamId} 0 R >>`);objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);}
 objects[2]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
 let pdf='%PDF-1.4\n',offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}
 const xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
 pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}
// Mobile-friendly, readable HTML preview; PDF file remains available for sharing and saving.
function reviewHtmlPreview(){
 const n=Number(state.period)||30,now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-n+1);
 const list=records().filter(r=>new Date(r.time)>=start&&new Date(r.time)<=now).sort((a,b)=>Date.parse(b.time)-Date.parse(a.time));
 const dateLabel=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
 const groups=new Map();for(const r of list){const k=r.slotId+'|'+r.unit,v=groups.get(k)||{name:r.name,unit:r.unit,id:r.slotId,count:0,total:0};v.count++;v.total+=Number(r.amount);groups.set(k,v);}
 const color=id=>{const c=state.slots.find(t=>t.id===id)?.color||'#62788b';return /^#[0-9a-f]{6}$/i.test(c)?c:'#62788b'};
 const bins=Array.from({length:n},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return {key:day(d),label:d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}});
 const ids=[...new Set(list.map(r=>r.slotId))],counts=new Map();for(const r of list){const k=day(new Date(r.time))+'|'+r.slotId;counts.set(k,(counts.get(k)||0)+1)}
 const max=Math.max(1,...bins.map(d=>ids.reduce((a,id)=>a+(counts.get(d.key+'|'+id)||0),0)));
 const bars=bins.map(d=>`<div class="rp-day" title="${esc(d.label)}"><div class="rp-stack">${ids.map(id=>{const count=counts.get(d.key+'|'+id)||0;return count?`<span style="height:${count/max*100}%;background:${color(id)}" title="${esc(list.find(r=>r.slotId===id)?.name||'Tracker')}: ${count} entries"></span>`:''}).join('')}</div></div>`).join('');
 const formatTime=r=>new Date(r.time).toLocaleString('en-US',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
 return `<article class="rp-sheet"><header class="rp-brand"><strong><span>Insu</span><span class="rp-accent">Tap</span></strong><small>EVERY UN<span class="rp-accent">IT</span>. ONE TAP.</small></header><div class="rp-heading"><h2>${n}-Day Activity Report</h2><p>${esc(dateLabel(start))} – ${esc(dateLabel(now))} · ${list.length} recorded entries</p></div><h3>Totals by tracker</h3><div class="rp-totals">${[...groups.values()].map(g=>`<div class="rp-total"><span class="rp-dot" style="background:${color(g.id)}"></span><strong style="color:${color(g.id)}">${esc(g.name)}</strong><span>${fmt(g.total)} ${esc(g.unit)} <small>(${g.count} logs)</small></span></div>`).join('')||'<p>No entries in this period.</p>'}</div><h3>Recorded activity</h3><div class="rp-table"><div class="rp-row rp-th"><span>TRACKER</span><span>UNITS</span><span>DATE / TIME</span></div>${list.map(r=>`<div class="rp-row"><span class="rp-tracker" style="color:${color(r.slotId)}"><i style="background:${color(r.slotId)}"></i>${esc(r.name)}</span><strong>${fmt(r.amount)} ${esc(r.unit)}</strong><time>${esc(formatTime(r))}</time></div>`).join('')||'<p>No activity recorded.</p>'}</div><h3>Usage trend</h3><p class="rp-note">Daily logged entries by tracker · colors match your tracker settings</p><div class="rp-chart">${bars}</div><div class="rp-axis"><span>${esc(bins[0]?.label||'')}</span><span>${esc(bins[bins.length-1]?.label||'')}</span></div><div class="rp-legend">${ids.map(id=>`<span><i style="background:${color(id)}"></i>${esc(list.find(r=>r.slotId===id)?.name||'Tracker')}</span>`).join('')}</div><p class="rp-note rp-footer">Bars show logged-entry counts, not combined medication amounts. User-entered information may be incomplete. Not medical advice.</p></article>`;
}
// Preview first: sharing and saving happen only after the user chooses them.
let reportPreview=null;
function closeReportPreview(){
 const overlay=document.getElementById('it-report-preview');
 if(overlay)overlay.remove();
 if(reportPreview){URL.revokeObjectURL(reportPreview.url);reportPreview=null;}
 document.body.style.overflow='';
}
function openReviewPdf(){
 const n=Number(state.period)||30,filename=`InsuTap_${n}-Day_Report_${day(new Date())}.pdf`;
 try{
  closeReportPreview();
  const blob=reviewPdfBytes(),url=URL.createObjectURL(blob);
  reportPreview={blob,url,filename,n};
  document.body.style.overflow='hidden';
  const overlay=document.createElement('section');overlay.id='it-report-preview';
  overlay.className='it-report-preview';overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',`${n}-day InsuTap PDF report preview`);
  overlay.innerHTML=`<div class="it-report-toolbar"><div class="it-report-title"><strong>${n}-Day Report</strong><small>Preview before sharing</small></div><button type="button" class="it-report-close" data-report-close aria-label="Close report preview">✕</button></div><div class="it-report-document rp-document">${reviewHtmlPreview()}</div><div class="it-report-actions"><button type="button" class="outline" data-report-open>Open Full PDF</button><button type="button" class="outline" data-report-save>Save PDF</button><button type="button" class="primary" data-report-share>Share Report</button></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-report-close]').addEventListener('click',closeReportPreview);
  overlay.querySelector('[data-report-open]').addEventListener('click',()=>window.open(url,'_blank','noopener'));
  overlay.querySelector('[data-report-save]').addEventListener('click',()=>{const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();notice('PDF download requested. Check Files or Downloads.');});
  overlay.querySelector('[data-report-share]').addEventListener('click',async()=>{
   try{
    const file=new File([blob],filename,{type:'application/pdf'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
     await navigator.share({files:[file],title:`InsuTap ${n}-Day Report`});
    }else{
     window.open(url,'_blank','noopener');
     notice('Use your browser’s Share button to send or save the report.');
    }
   }catch(e){if(e.name!=='AbortError')notice('Sharing unavailable. Try Open Full PDF or Save PDF.');}
  });
  overlay.querySelector('[data-report-close]').focus();
 }catch(e){closeReportPreview();notice('Could not preview the PDF. Your saved records are unchanged.');}
}

function summary(){return summarize(scopedRecords())}
function csv(){return makeCSV(scopedRecords())}
function download(name,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function shareSendPdf(){
 const range=state.shareDays,ids=[...state.shareIds],label=range==='all'?'All':range+'-Day';
 try{
  const blob=reviewPdfBytes(range,ids),filename=`InsuTap_${label}_Report_${day(new Date())}.pdf`;
  const file=new File([blob],filename,{type:'application/pdf'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:`InsuTap ${label} Report`});
  }else{
   download(filename,blob,'application/pdf');notice('PDF saved. Open it from Downloads or Files to share.');
  }
 }catch(e){if(e?.name!=='AbortError')notice('Unable to share PDF. Your records have not changed.');}
}
function aiExportText(list){
 const period=state.shareDays==='all'?'all available records':`the last ${state.shareDays} days`;
 return `InsuTap user-entered activity for ${period}. These are unverified tracking records, not prescribed doses or proof of adherence. Do not suggest dose adjustments or medical treatment. Summarize activity patterns, per-tracker totals and logging frequency; flag possible missing data. Different units must not be added together.\n\n${summarize(list,false)}`;
}
function send(){
 const list=scopedRecords(),allIds=[...new Set([...state.slots.map(s=>s.id),...records().map(r=>r.slotId)])];
 const days=state.shareDays==='all'?'All':state.shareDays+'-Day';
 return `<h2 class="h">Share Your Data</h2><p class="note">Your records. Your choice. Nothing is sent automatically.</p><div class="card"><h3>Choose a time period</h3><div class="review-period-label">SELECT DAYS TO INCLUDE</div><div class="review-periods send-periods" role="group" aria-label="Choose days to share">${[['7','7'],['14','14'],['30','30'],['90','90'],['all','All']].map(([v,t])=>`<button type="button" class="${state.shareDays===v?'selected':''}" data-share-period="${v}" aria-pressed="${state.shareDays===v}"><strong>${t}</strong><span>${v==='all'?'records':'days'}</span></button>`).join('')}</div><details><summary>Choose trackers (${state.shareIds.length?state.shareIds.length:'All'})</summary><p class="note">No selection means include all trackers.</p>${allIds.map(id=>{const sl=state.slots.find(s=>s.id===id),r=records().find(r=>r.slotId===id);return `<label class="check-row"><input type="checkbox" data-share-id="${esc(id)}" ${state.shareIds.includes(id)?'checked':''}> ${esc(sl?.name||r?.name||id)}</label>`}).join('')}<button class="outline" data-share-all>Include all</button></details><p class="note">${list.length} records selected</p><div class="send-actions"><button class="primary" data-send-pdf>↗ Send ${days} PDF Report<small>Choose Messages, Mail, Files, or another app</small></button><button class="outline" data-send-sheet>▤ ${days} Spreadsheet<small>For Excel, Numbers, or Google Sheets</small></button><button class="outline" data-send-ai>✧ Copy ${days} Records for AI<small>Detailed, structured entries for analysis</small></button></div><p class="send-purpose">Each option uses your selected date range and trackers, but prepares a different format for its purpose.</p></div><div class="card"><h3>Saved Export Presets</h3><p class="note">Save the current date range and tracker selection for next time.</p><button class="outline wide" data-save-preset ${state.exportPresets.length>=5?'disabled':''}>Save Current Selection</button>${state.exportPresets.map((p,i)=>`<div class="entry"><span>${esc(p.label)}</span><div class="actions"><button class="outline" data-use-preset="${i}">Use</button><button class="outline danger" data-remove-preset="${i}">×</button></div></div>`).join('')}</div><div class="card"><h3>Privacy reminder</h3><p class="note">Exports may contain sensitive health information. Review the destination before sharing. AI services have their own privacy policies. None of these reports is a full app backup; use the JSON backup in Customize IT to protect your records.</p></div>`;
}

'Rose','Slate'][j]}" aria-pressed="${s.color===c}">${s.color===c?'✓':''}</button>`).join('')}</div><button type="button" class="custom-picker-toggle" data-picker-toggle="${i}:symbol" aria-expanded="false"><span class="picker-title"><span class="picker-symbol">${esc(s.symbol||'●')}</span>Symbol</span><span class="picker-right">Change <span aria-hidden="true">⌄</span></span></button><div class="choice-grid picker-choices" data-picker-panel="${i}:symbol" role="group" aria-label="Symbol for ${esc(s.name)}" hidden>${[...new Set([s.symbol,...SYMBOLS].filter(Boolean))].map(v=>`<button type="button" class="choice-tile emoji-choice" data-visual-choice="${i}:symbol" data-choice-value="${esc(v)}" aria-label="Choose ${esc(v)}" aria-pressed="${s.symbol===v}">${esc(v)}</button>`).join('')}</div><p class="note">Tap Color or Symbol to change its appearance. Selections save automatically.</p><select class="picker-hidden-select" aria-label="Color selection for ${esc(s.name)}" data-field="${i}:color"><option value="${esc(s.color)}" selected>${esc(s.color)}</option>${COLORS.filter(c=>c!==s.color).map(c=>`<option value="${c}">${c}</option>`).join('')}</select><select class="picker-hidden-select" aria-label="Symbol selection for ${esc(s.name)}" data-field="${i}:symbol"><option value="${esc(s.symbol)}" selected>${esc(s.symbol)}</option>${SYMBOLS.filter(v=>v!==s.symbol).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('')}${state.slots.length<6?`<div class="card"><h3>Add tracker (${state.slots.length}/6)</h3><label for="newCategory">Choose category</label><select id="newCategory"><option value="">Select an option…</option>${Object.entries(CATEGORIES).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('')}</select><button class="primary" data-add-tracker style="margin-top:12px">Add Tracker</button></div>`:'<p class="note">Maximum of six active trackers. Remove one to add another.</p>'}<div class="card"><h3>Insulin supply settings</h3><label>Rapid delivery method</label><select id="mode"><option value="patch" ${state.mode==='patch'?'selected':''}>Patch</option><option value="mdi" ${state.mode==='mdi'?'selected':''}>MDI (pen)</option></select><div class="two"><div><label>Rapid capacity (U)</label><input type="number" id="rapidCap" min="1" value="${esc(state.rapidCapacity)}"></div><div><label>Basal capacity (U)</label><input type="number" id="basalCap" min="1" value="${esc(state.basalCapacity)}"></div></div><p class="note">Supply counters are estimates only and exclude priming, waste, and unlogged doses.</p>${state.mode==='patch'?`<div class="patch-start"><span>Last Patch Started</span><strong>${esc(patchDate(state.patchStartedAt))}</strong><button type="button" class="outline patch-edit-button" data-edit-patch-start>✎ Edit</button></div>${patchStartEditing?`<div class="patch-edit-panel"><label for="patchStartInput">Patch start date and time</label><input id="patchStartInput" type="datetime-local" value="${state.patchStartedAt?esc(localStamp(state.patchStartedAt)):''}"><div class="actions" style="margin-top:9px"><button type="button" class="outline" data-cancel-patch-start>Cancel</button><button type="button" class="edit-blue" data-save-patch-start>Save changes</button></div></div>`:''}${state.patchHistory?.length?`<details class="patch-history"><summary>Previous patch starts (${state.patchHistory.length})</summary>${state.patchHistory.slice().reverse().map(x=>`<div>${esc(patchDate(x))}</div>`).join('')}</details>`:''}`:''}<div class="actions"><button class="outline" data-new="rapid">New ${state.mode==='patch'?'Patch':'Rapid Pen'}</button><button class="outline" data-new="basal">New Basal Pen</button></div><details><summary>Supply history</summary><p class="note">Previous patch start dates</p>${(state.patchHistory||[]).map(x=>`<div class="entry">${esc(patchDate(x))}</div>`).join('')||'<p class="note">No earlier patch starts recorded.</p>'}</details></div><div class="card"><h3>App preferences</h3><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="haptics" ${state.haptics?'checked':''} style="width:auto"> Optional vibration feedback (where supported)</label><label>Language</label><select id="language"><option value="en" ${state.language==='en'?'selected':''}>English</option><option value="es" ${state.language==='es'?'selected':''}>Español (planned)</option></select><p class="note">Full Spanish translation is planned. Existing labels remain in English until translation is complete.</p></div><div class="card"><h3>Safety &amp; Intended Use</h3>${safetyText()}<p class="note">${state.safetyAcceptedAt?`Acknowledged ${esc(patchDate(state.safetyAcceptedAt))} · Version ${esc(state.safetyVersion||"initial")}`:"Acknowledgment not recorded on this device (existing users are not interrupted)."}</p></div><div class="card"><h3>Privacy &amp; Data</h3><p class="note">Records are stored in this browser's local storage and are not automatically sent to InsuTap or other services. Exporting or opening a donation link uses the destination you choose. Browser data deletion can erase records. Local storage is not encrypted by InsuTap.</p>${!state.lastBackupAt||Date.now()-Date.parse(state.lastBackupAt)>14*86400000?'<p class="backup-warning">Backup check: No recent backup recorded on this device.</p>':`<p class="note">Last backup requested: ${esc(patchDate(state.lastBackupAt))}. Verify the file was saved.</p>`}<button class="outline wide" data-backup>Download Full JSON Backup</button><button class="outline wide" data-import>Import JSON Backup</button><input type="file" id="importFile" accept="application/json,.json" class="hide"><button class="outline danger wide" data-delete>Delete All Local Data</button></div>`}
function learn(){const sections=[['home','Home'],['features','Features'],['how','Guide'],['install','Install'],['story','Our Story']];const nav=sections.map(([id,label])=>`<button type="button" class="learn-section ${learnSection===id?'chosen':''}" data-learn-section="${id}">${label}</button>`).join('');let body='';
const storageGuide=`<div class="learn-install-card"><h3>Where are my records saved?</h3><p class="note">InsuTap saves records locally in the current browser or installed Home Screen app. Safari and the Home Screen app may have separate storage on the same iPhone. They do not automatically sync.</p><p class="note"><strong>To move your records:</strong> Open the copy containing your entries → Send IT → Export JSON Backup. Save the JSON file in Files. Open the other copy → Send IT → Import JSON Backup, choose that file, and confirm replacement. Import replaces that copy's existing records; back up both copies first if they each contain entries.</p><p class="note">For consistent everyday tracking, choose one copy (preferably the Home Screen app), and use it consistently. Check that your records remain after fully closing and reopening it. Keep periodic backups.</p></div>`;
if(learnSection==='home')body=`<div class="learn-hero learn-hero-community"><div class="learn-kicker">WELCOME TO INSUTAP</div><h2>Every unit. One tap.</h2><p class="learn-hero-description">A simple, free way to record insulin, medications, supplements, and everyday routines—right on your device.</p><div class="learn-free-pill"><span aria-hidden="true">♡</span> Free to use. No account needed.</div><hr class="learn-mission-divider"><h3>Because managing a chronic condition is expensive enough.</h3><p class="learn-mission-copy">I created InsuTap to make daily tracking easier, without adding another expense. It’s my way of giving back to a community that understands the journey.</p><div class="learn-community-benefits"><span>✓ Simple logging</span><span>✓ No subscription</span><span>✓ Device-local records</span><span>✓ Your data, your choice</span></div></div><div class="learn-feature-grid"><div><b>Make IT yours</b><p>Choose your own trackers and amounts.</p></div><div><b>Keep IT simple</b><p>Log with a tap and review your history.</p></div></div><div class="learn-install-card"><h3>Get started in three steps</h3><ol class="learn-steps"><li><b>Understand IT.</b> Review the safety information before tracking.</li><li><b>Customize IT.</b> Choose the trackers and increments that fit your routine.</li><li><b>Track IT.</b> Tap to build an amount, then press LOG to record it.</li></ol></div><button class="outline wide" data-learn-jump="install">Add InsuTap to your Home Screen →</button>`;
else if(learnSection==='features')body=`<h2>Made for your routine</h2><div class="learn-feature-grid"><div><b>Track IT</b><p>Tap an amount, then press LOG to save a timestamped entry.</p></div><div><b>Review IT</b><p>See your recorded activity and trends.</p></div><div><b>Send IT</b><p>Export CSV files and activity reports when you choose.</p></div><div><b>Customize IT</b><p>Set names, increments, units, symbols and colors.</p></div></div><p class="note">InsuTap is a recordkeeping tool, not a dosing calculator, glucose monitor or medical advice service.</p>`;
else if(learnSection==='how')body=`<h2>Learn how to Track IT</h2><ol class="learn-steps"><li><b>Choose your trackers.</b> Start with a blank selection. Add the insulin, medication, supplement or custom items you want.</li><li><b>Customize each tracker.</b> Set the name, measurement unit, increment, color and symbol.</li><li><b>Tap to build an amount.</b> Check the selected amount before pressing LOG. Nothing is recorded until you press LOG.</li><li><b>Review and share.</b> View your history under Review IT and export records using Send IT.</li><li><b>Protect your records.</b> Save a backup regularly and keep the downloaded file somewhere secure.</li></ol><button class="outline wide" data-replay-guide>Review this guide again</button><button class="outline wide" data-learn-jump="install">Next: Add to Home Screen →</button>`;
else if(learnSection==='install')body=storageGuide+`<div class="learn-kicker">MAKE IT FEEL LIKE AN APP</div><h2>Add InsuTap to your Home Screen</h2><p>InsuTap is a web app you can launch from your phone or tablet's Home Screen. No App Store download or account is required.</p><div class="learn-install-card"><h3>🍎 iPhone &amp; iPad — Safari</h3><ol class="learn-steps"><li>Open your InsuTap website in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an upward arrow). Depending on your iOS version, it may be in the browser menu.</li><li>Scroll or open the menu and choose <b>Add to Home Screen</b>.</li><li>Keep the name <b>InsuTap</b>, then tap <b>Add</b>.</li><li>Open InsuTap using its new Home Screen icon.</li></ol></div><div class="learn-install-card"><h3>🤖 Android — Chrome</h3><ol class="learn-steps"><li>Open your InsuTap website in <b>Chrome</b>.</li><li>Tap the <b>three-dot menu</b>.</li><li>Choose <b>Add to Home screen</b> or <b>Install app</b>, if offered.</li><li>Confirm, then launch InsuTap from your Home Screen.</li></ol></div><p class="note">Menu wording can vary by browser and device. Adding to Home Screen does not guarantee offline use; offline support must be tested and configured separately.</p><h3>Your data stays on this device</h3><p>InsuTap currently stores your logs and settings in this browser's local storage. Records do not automatically sync to other devices or cloud accounts. Clearing website data, changing browsers, or removing the Home Screen app may permanently erase your records.</p><p class="backup-warning"><b>Back up regularly.</b> Store the exported JSON backup securely. Restoring a backup replaces the current local records and settings.</p><button class="outline wide" data-backup>↓ Download full backup (.json)</button><button class="outline wide" data-import>↑ Restore from backup</button><input id="importFile" type="file" accept="application/json,.json" class="hide" aria-label="Select InsuTap backup file"><p class="note">If you are using InsuTap in both Safari and a Home Screen installation, confirm that your existing records appear before switching. Storage may not be shared between those contexts.</p>`;
else body=`<h2>Why I built InsuTap</h2><p>Hi, I'm Josh. I'm a dad to two sons, and I was diagnosed with type 1 diabetes in 2023.</p><p>Managing a chronic condition takes time and attention. I wanted to spend less time navigating screens to record doses and more time enjoying life, especially with my boys.</p><p>That's why I created InsuTap: a simple way to record manual doses and everyday routines without making tracking another burden.</p><p>InsuTap is being developed as a web-based tracking tool. Access and commercial terms may evolve as the product develops.</p><p>Thank you for being here! 💙</p><h3>Support InsuTap</h3><p class="note">If InsuTap makes your routine easier, you can optionally support its continued development. This contribution is separate from any future product access terms.</p>${supportDonation()}<h3>Important safety information</h3>${safetyText()}`;
return `<div class="learn-page"><div class="learn-nav" role="group" aria-label="Learn about InsuTap">${nav}</div><section class="card learn-content">${body}${learnSection==='home'?`<button class="primary" data-learn-start>${state.onboarded?'Go to Track IT':'Get Started'} →</button>`:''}</section></div>`}
function supportDonation(){return `<div class="support-amounts" role="group" aria-label="Choose a support amount">${['3','5','10','20','Other'].map(v=>`<button type="button" data-support-amount="${v}" class="support-choice ${supportAmount===v?'selected':''}" aria-pressed="${supportAmount===v}">${v==='Other'?'Other':'$'+v}</button>`).join('')}</div>${supportAmount==='Other'?`<label class="support-label" for="supportOther">Enter your amount (USD)</label><input id="supportOther" type="number" min="0.01" max="10000" step="0.01" inputmode="decimal" value="${esc(supportOther)}">`:''}<a id="supportPay" class="primary" href="${supportUrl()}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;text-decoration:none;margin-top:12px">♡ Support InsuTap${supportSelectedAmount()?' — $'+supportSelectedAmount().toFixed(2):''}</a><p class="note">Optional development contribution. Not a subscription or product-access payment.</p>`}
function supportSelectedAmount(){const n=Number(supportAmount==='Other'?supportOther:supportAmount);return Number.isFinite(n)&&n>=0.01&&n<=10000&&Math.round(n*100)/100===n?n:null}
function supportUrl(){const n=supportSelectedAmount();return n?'https://paypal.me/JoshuaSkinner335/'+n.toFixed(2):'#'}

function welcomeScreen(){return `<section class="it-welcome" role="dialog" aria-modal="true" aria-label="Welcome to InsuTap"><div class="it-welcome-inner"><div class="it-welcome-reveal"><div class="it-welcome-stage one"><div class="it-welcome-hook"><span class="it-welcome-logo"><svg class="it-signature" viewBox="0 0 155 94" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="itInk" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#073b79"/><stop offset="1" stop-color="#176fc3"/></linearGradient><linearGradient id="itOrbit" x1="0" x2="1"><stop stop-color="#28c5bd"/><stop offset="1" stop-color="#04aab6"/></linearGradient></defs><path d="M13 72C-2 87 36 91 79 73C118 57 150 26 137 12C128 2 112 6 96 12" fill="none" stroke="url(#itOrbit)" stroke-width="3.2" stroke-linecap="round"/><g transform="translate(27 17) skewX(-14)" fill="url(#itInk)"><path d="M4 2h20L13 58H-7Z"/><path d="M31 2h77l-4 15H76L67 58H47l9-41H27Z"/></g></svg></span><span>really is that easy.</span></div></div><div class="it-welcome-stage two"><div class="it-welcome-wordmark">Insu<span>Tap</span></div></div></div><div class="it-welcome-stage three"><div class="it-welcome-tag">EVERY UN<span style="color:#1769c2">IT</span>. ONE TAP.</div></div><div class="it-welcome-action"><button class="primary" type="button" data-welcome-continue>Get Started</button><div class="it-welcome-sub">Next: important safety information</div><button type="button" class="it-welcome-skip" data-welcome-continue>Skip intro</button></div></div></section>`}
function showTrackerCreated(){const existing=document.querySelector('.it-created-flash');if(existing)existing.remove();const el=document.createElement('div');el.className='it-created-flash';el.setAttribute('role','status');el.innerHTML=`<div class="it-created-panel"><span class="it-welcome-logo"><svg class="it-signature" viewBox="0 0 155 94" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="itInk" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#073b79"/><stop offset="1" stop-color="#176fc3"/></linearGradient><linearGradient id="itOrbit" x1="0" x2="1"><stop stop-color="#28c5bd"/><stop offset="1" stop-color="#04aab6"/></linearGradient></defs><path d="M13 72C-2 87 36 91 79 73C118 57 150 26 137 12C128 2 112 6 96 12" fill="none" stroke="url(#itOrbit)" stroke-width="3.2" stroke-linecap="round"/><g transform="translate(27 17) skewX(-14)" fill="url(#itInk)"><path d="M4 2h20L13 58H-7Z"/><path d="M31 2h77l-4 15H76L67 58H47l9-41H27Z"/></g></svg></span><span class="it-apostrophe">’s that easy!</span></div>`;document.body.appendChild(el);const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?650:1400;setTimeout(()=>el.remove(),duration)}

function render(){todayKey=day(new Date());if(!state.safetyAcceptedAt&&!['learn','track'].includes(state.tab))state.tab='track';if(!visible().some(s=>s.id===state.active))state.active=visible()[0]?.id||null;nav();$('screen').innerHTML=(storageFault?`<section class="storage-alert" role="alert"><strong>Saved data needs attention</strong><p>${esc(storageFault)}</p><p>Do not clear browser data or uninstall the app. The Safari and Home Screen copies may have different storage.</p></section>`:'')+(state.tab==='learn'?learn():state.tab==='track'?track():state.tab==='trends'?trends():state.tab==='send'?send():custom());bind();if(welcomeOpen){document.querySelector('.it-welcome')?.remove();document.body.insertAdjacentHTML('beforeend',welcomeScreen());document.querySelectorAll('[data-welcome-continue]').forEach(b=>b.addEventListener('click',()=>{welcomeOpen=false;document.querySelector('.it-welcome')?.remove();learnSection='home';state.tab='learn';render()}))}}
function logDose(timestamp){
 if(storageFault){notice(storageFault);return}
 if(Date.now()-lastLogAt<900)return;
 const s=current();if(!s)return;
 const amount=Number(state.pending[s.id]||0);
 if(!validAmount(amount)||!Number.isFinite(Date.parse(timestamp))||Date.parse(timestamp)>Date.now()+60000){notice('Invalid amount or timestamp');return}
 const r={id:uid(),time:timestamp,slotId:s.id,name:s.name,unit:s.unit,amount,type:s.type,mode:s.type==='rapid'?state.mode:s.type==='basal'?'mdi':''};
 if(!validateRecord(r)){notice('Invalid entry');return}
 // Build a complete candidate without changing the live record list or pending amount.
 const next={...state,records:[r,...state.records],pending:{...state.pending,[s.id]:0},remaining:{...state.remaining}};
 if(r.type==='rapid'||r.type==='basal'){
  const k=r.type;
  next.remaining[k]=Math.max(0,Math.min(Number(state[k+'Capacity']),Math.round((Number(state.remaining[k]||0)-amount)*1000)/1000));
 }
 // Confirm storage accepted the candidate before showing success or clearing the dose.
 try{
  const serialized=JSON.stringify(next);
  localStorage.setItem(KEY,serialized);
  if(localStorage.getItem(KEY)!==serialized)throw new Error('Stored data verification failed');lastCommitted=serialized;
 }catch(e){notice('Log NOT saved. Storage unavailable; your selected amount is still here. Free up space or export a backup, then try again.');return}
 state=next;
 lastLogAt=Date.now();earlierOpen=false;undoLog={id:r.id};
 render();if(state.haptics&&navigator.vibrate)navigator.vibrate(35);
 toast(`✓ ${fmt(amount)} ${s.unit} ${s.name} logged`,true);
}
